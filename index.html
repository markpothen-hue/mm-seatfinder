  :root{
    --wine:#5a1a20; --wine-deep:#45131a;
    --forest:#37451e; --forest-deep:#2c3818; --forest-soft:#42502a;
    --cream:#f3eee1; --cream-text:#ece6d4; --cream-dim:#c8c2ac;
    --gold:#c6a96b; --gold-bright:#dcc086;
    --ink:#2c3818;
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script:"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--serif);
    color:var(--cream-text);
    background:
      radial-gradient(120% 90% at 50% -10%, #435324 0%, var(--forest) 42%, var(--forest-deep) 100%);
    background-attachment:fixed;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.5;
  }
  ::selection{background:var(--gold);color:var(--forest-deep)}
  .wrap{max-width:660px;margin:0 auto;padding:clamp(28px,6vw,56px) 22px 96px}

  /* ---- masthead ---- */
  .eyebrow{
    text-align:center;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--gold);font-weight:500;margin:0 0 18px;padding-left:.34em;
  }
  .names{
    font-family:var(--script);font-weight:400;
    font-size:clamp(3.4rem,15vw,6rem);line-height:.9;text-align:center;
    color:var(--cream);margin:0;
    text-shadow:0 2px 24px rgba(0,0,0,.28);
  }
  .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 8px}
  .rule::before,.rule::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule::after{transform:scaleX(-1)}
  .rule span{color:var(--gold);font-size:1rem}
  .title{
    text-align:center;text-transform:uppercase;letter-spacing:.3em;
    font-weight:500;font-size:clamp(1.05rem,3.6vw,1.5rem);margin:2px 0 4px;padding-left:.3em;
    color:var(--cream-text);
  }
  .subtitle{text-align:center;color:var(--cream-dim);font-size:1.02rem;font-style:italic;margin:0 0 34px}

  /* ---- search ---- */
  .search{position:relative;max-width:460px;margin:0 auto 8px}
  .search input{
    width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--gold);
    color:var(--cream);font-family:var(--serif);font-size:1.5rem;font-weight:400;
    text-align:center;padding:12px 34px 12px 12px;outline:none;letter-spacing:.02em;
  }
  .search input::placeholder{color:rgba(236,230,212,.45);font-style:italic;letter-spacing:.06em}

  .hint{text-align:center;color:var(--cream-dim);font-size:.9rem;font-style:italic;margin:12px 0 0;min-height:1.2em}

  /* ---- results ---- */

  .fade{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* disambiguation choices */
  .choice{
    width:100%;text-align:left;cursor:pointer;
    background:rgba(243,238,225,.05);border:1px solid rgba(198,169,107,.3);
    border-radius:3px;padding:15px 18px;color:var(--cream-text);font-family:var(--serif);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;transition:background .18s,border-color .18s;
  }
  .choice:hover,.choice:focus-visible{background:rgba(243,238,225,.1);border-color:var(--gold);outline:none}
  .choice .nm{font-size:1.28rem;letter-spacing:.01em}
  .choice .nm small{display:block;color:var(--cream-dim);font-size:.82rem;font-style:italic;letter-spacing:0}
  .choice .tb{color:var(--gold-bright);text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;white-space:nowrap}
  .prompt{text-align:center;color:var(--cream-dim);font-style:italic;margin:0 0 4px}

  /* the escort card */
  .card{
    background:linear-gradient(180deg, rgba(243,238,225,.09), rgba(243,238,225,.045));
    border:1px solid rgba(198,169,107,.4);border-radius:4px;

  .card .seatlabel{text-transform:uppercase;letter-spacing:.28em;font-size:.78rem;color:var(--cream-dim);margin:0}
  .card .tnum{font-size:clamp(3.6rem,17vw,5.4rem);font-weight:300;line-height:1;color:var(--gold-bright);margin:2px 0 0;letter-spacing:.02em}
  .card .tnum.head{font-family:var(--script);font-size:clamp(2.4rem,11vw,3.4rem);font-weight:400}
  .card .headnote{max-width:340px;margin:14px auto 0;color:var(--cream-text);font-style:italic;font-size:1.02rem}
  .card .mates{margin:22px auto 0;max-width:420px}
  .card .mates h4{text-transform:uppercase;letter-spacing:.24em;font-size:.72rem;color:var(--gold);font-weight:500;margin:0 0 12px;
    display:flex;align-items:center;justify-content:center;gap:12px}
  .card .mates h4::before,.card .mates h4::after{content:"";height:1px;width:26px;background:var(--gold);opacity:.5}
  .card ul{list-style:none;margin:0;padding:0;column-gap:26px;font-size:1.08rem;color:var(--cream-text)}
  .card ul.two{column-count:2;text-align:left}
  .card li{padding:3px 0;break-inside:avoid;line-height:1.35}
  .card li.self{color:var(--gold-bright)}
  .card li.self::after{content:" ✦";font-size:.7em;color:var(--gold)}

  /* no match */
  .nomatch{text-align:center;color:var(--cream-dim);padding:20px 10px}
  .nomatch .big{font-family:var(--script);font-size:2.4rem;color:var(--cream);margin-bottom:6px;line-height:1}

  /* ---- map ---- */
  .maptoggle{
    display:block;margin:20px auto 0;background:none;border:0;color:var(--gold);cursor:pointer;
    font-family:var(--serif);text-transform:uppercase;letter-spacing:.2em;font-size:.82rem;
    border-bottom:1px solid transparent;padding:4px 2px;transition:border-color .2s;
  }
  .maptoggle:hover{border-color:var(--gold)}
  .mapwrap{margin-top:20px}
  .mapcard{border:1px solid rgba(198,169,107,.3);border-radius:4px;padding:14px 12px 8px;background:rgba(44,56,24,.35)}
  .mapcap{text-align:center;text-transform:uppercase;letter-spacing:.22em;font-size:.68rem;color:var(--gold);margin:2px 0 8px}
  svg{width:100%;height:auto;display:block;touch-action:pan-x pan-y}
  .zone{fill:none;stroke:var(--cream-dim);stroke-width:1.4}
  .zonefill{fill:rgba(236,230,212,.06)}
  .zlabel{fill:var(--cream-dim);font-family:var(--serif);text-transform:uppercase;letter-spacing:.14em;font-weight:500}
  .floor{fill:rgba(198,169,107,.05);stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4}
  .floorlabel{fill:var(--gold);font-family:var(--serif);text-transform:uppercase;letter-spacing:.18em}
  .tcirc{fill:rgba(44,56,24,.6);stroke:var(--cream-dim);stroke-width:1.3}
  .tnum2{fill:var(--cream-dim);font-family:var(--serif);font-weight:500;text-anchor:middle;dominant-baseline:central}
  .tg.on .tcirc{fill:var(--gold-bright);stroke:var(--gold-bright)}
  .tg.on .tnum2{fill:var(--forest-deep);font-weight:600}
  .pulse{fill:none;stroke:var(--gold-bright);stroke-width:2;opacity:0}
  .tg.on .pulse{animation:ping 1.8s ease-out infinite}
  @keyframes ping{0%{opacity:.9;r:14}70%{opacity:0;r:34}100%{opacity:0;r:34}}

  }

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('seatdata').textContent);
  var TABLES = DATA.tables, INDEX = DATA.index, POS = DATA.pos;
  // Head table — the bride & groom on the riser (not in the seating sheet)
  TABLES["Head"] = ["Mark","Marissa"];
  INDEX = INDEX.concat([
    {name:"Mark", party:"Mark & Marissa", table:"Head"},
    {name:"Marissa", party:"Mark & Marissa", table:"Head"},
    {name:"Mark Pothen", party:"Mark & Marissa", table:"Head"}

  function norm(s){
    return (s||"").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  // build search records (one per individual person)
  var RECORDS = INDEX.map(function(r){
    var k = norm(r.name);
    return {name:r.name, party:r.party, table:r.table, key:k, toks:k.split(' ')};
  });

  function search(raw){
    var nq = norm(raw);
    if(nq.length < 2) return [];
    var qt = nq.split(' ');
    var hits = RECORDS.filter(function(r){
      return qt.every(function(t){
        return r.toks.some(function(tok){return tok.indexOf(t)===0;}) || r.key.indexOf(t)>=0;
      });
    });
    // rank: exact/startsWith full name first, then alpha
    hits.sort(function(a,b){
      var as = a.key.indexOf(nq)===0 ? 0 : 1, bs = b.key.indexOf(nq)===0 ? 0 : 1;
      if(as!==bs) return as-bs;
      return a.name.localeCompare(b.name);
    });
    // de-dupe identical name+table
    var seen={}, out=[];
    hits.forEach(function(h){var id=h.key+'|'+h.table; if(!seen[id]){seen[id]=1;out.push(h);}});
    return out;

  var clearBtn = document.getElementById('clear');

  function render(){
    var q = input.value;
    clearBtn.classList.toggle('show', q.length>0);

    if(norm(q).length < 2){ hint.textContent = q.length? 'Keep typing…' : ''; return; }

      results.appendChild(nm);
      return;

    // distinct tables among matches

    if(res.length===1 || !multiTables){
      hint.textContent='';
      showTable(res[0].table, res.map(function(r){return r.name;}));

    }
  }

  function showTable(t, selfNames){

    var selfSet = {}; (selfNames||[]).forEach(function(n){selfSet[norm(n)]=1;});
    function isSelf(cell){
      return cell.split(/\s*&\s*|\s+and\s+|\s*,\s*/).some(function(p){return selfSet[norm(p)];});
    }

    var isHead = (t==="Head");
    var listCls = mates.length>6 ? 'two' : '';

        if(!built){ mw.appendChild(buildMap(t)); built=true; }
